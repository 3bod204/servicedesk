<header class="topbar">
  <div class="topbar-breadcrumb">
    <span class="crumb-active">{{ breadcrumb }}</span>
  </div>

  <div class="topbar-search">
    <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path>
    </svg>
    <input type="text" placeholder="Search tickets…" />
  </div>

  <div class="topbar-actions">
    <a class="icon-btn" routerLink="/profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
      </svg>
    </a>
  </div>
</header>
