<header class="topbar">
  <div class="topbar-breadcrumb">
    <span class="crumb-active">{{ breadcrumb }}</span>
  </div>

  <div class="topbar-actions">
    <a class="icon-btn" routerLink="/profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
      </svg>
    </a>
    <button type="button" class="icon-btn" (click)="logout()" aria-label="Log out" title="Log out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path>
      </svg>
    </button>
  </div>
</header>
